// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    
    // Fix for Capacitor android library using deprecated proguard-android.txt
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android.buildTypes.all { buildType ->
                def files = buildType.proguardFiles
                if (files.contains(project.android.getDefaultProguardFile('proguard-android.txt'))) {
                    def newFiles = files.collect { 
                        it == project.android.getDefaultProguardFile('proguard-android-optimize.txt') ?
                              project.android.getDefaultProguardFile('proguard-android-optimize.txt') : it 
                    }
                    buildType.setProguardFiles(newFiles)
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
